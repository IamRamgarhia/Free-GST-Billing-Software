# The Mac app: Free-GST-Billing-Mac.dmg, built and smoke-tested on GitHub's
# free macos-15 runner, by hand only. NOT attached to releases (14 Nov 2026):
# without a paid Apple Developer ID, macOS says "Apple could not verify" and
# offers Move to Bin. Mac users install with the Terminal line (install.sh),
# which shows no warning. Attach it again only once it is signed and notarized.
name: Mac app

on:
  push:
    branches: [mac-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the app and the DMG
        run: bash scripts/build-mac-app.sh release-build/mac

      - name: Smoke test (open the DMG, start the app, API, stop, start again)
        run: bash scripts/test-mac-app.sh release-build/mac/Free-GST-Billing-Mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Free-GST-Billing-Mac
          path: release-build/mac/Free-GST-Billing-Mac.dmg
          if-no-files-found: error
          compression-level: 0
