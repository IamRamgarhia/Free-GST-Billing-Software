services:
  free-gst-billing:
    image: free-gst-billing:1.10.66
    build: .
    container_name: free-gst-billing
    restart: unless-stopped
    ports:
      - "${FREEGST_PORT:-47371}:47371"
    environment:
      HOST: 0.0.0.0
      PORT: 47371
      DATA_DIR: /data
      # Set these in a .env file or NAS environment settings.
      GST_API_PROVIDER: ${GST_API_PROVIDER:-}
      GST_API_KEY: ${GST_API_KEY:-}
      GST_API_URL: ${GST_API_URL:-}
      GST_API_TIMEOUT_MS: ${GST_API_TIMEOUT_MS:-8000}
      GST_RATE_LIMIT: ${GST_RATE_LIMIT:-30}
    volumes:
      - free-gst-billing-data:/data

volumes:
  free-gst-billing-data:
