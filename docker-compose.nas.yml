services:
  free-gst-billing:
    image: ghcr.io/deppen12/free-gst-billing-software:latest
    container_name: free-gst-billing
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${FREEGST_PORT:-47371}:47371"
    environment:
      HOST: 0.0.0.0
      PORT: 47371
      DATA_DIR: /data
      GST_API_PROVIDER: ${GST_API_PROVIDER:-}
      GST_API_KEY: ${GST_API_KEY:-}
      GST_API_URL: ${GST_API_URL:-}
      GST_API_TIMEOUT_MS: ${GST_API_TIMEOUT_MS:-8000}
      GST_RATE_LIMIT: ${GST_RATE_LIMIT:-30}
    volumes:
      - free-gst-billing-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Checks GHCR for a new :latest image and recreates only this labelled
  # service. The billing volume is never removed.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: free-gst-billing-updater
    restart: unless-stopped
    command: --label-enable --interval ${UPDATE_INTERVAL_SECONDS:-3600} --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  free-gst-billing-data:
